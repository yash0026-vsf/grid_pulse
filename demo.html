// ==========================================
// 2. 24-HOUR TELEMETRY SIMULATION ENGINE
// ==========================================


function generateMicrogridTelemetry(
  specs,
  cloudDropActive,
  cloudSeverity = 0.53,
  edgeGuardEnabled = true,
  productionSurgePct = 0
) {
  const points = [];
  const dtHours = 0.25; // 15-minute intervals (96 points)
  let currentSoc = 0.55 * specs.bessCapacityKwh;

  for (let i = 0; i < 96; i++) {
    const hour = i * dtHours;
    const h = Math.floor(hour);
    const m = Math.floor((hour - h) * 60);
    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

    // 1. Time-of-Use Tariff ($/kWh)
    let tariff = 0.08; // Off-peak (22:00 - 06:00)
    if (hour >= 14 && hour < 20) {
      tariff = 0.34; // On-peak
    } else if ((hour >= 6 && hour < 14) || (hour >= 20 && hour < 22)) {
      tariff = 0.16; // Mid-peak
    }

    // 2. Solar PV Output
    let solarKw = 0;
    if (hour >= 6 && hour <= 18.5) {
      const sunAngle = Math.sin(((hour - 6.0) / 12.5) * Math.PI);
      const baseSolar = specs.solarCapacityKw * Math.pow(Math.max(0, sunAngle), 1.15);
      solarKw = baseSolar;

      // Simulated sudden cloud event (13:30 - 15:30)
      if (cloudDropActive && hour >= 13.5 && hour < 15.5) {
        solarKw *= (1.0 - cloudSeverity);
      }
    }

    // 3. Factory Production Load Profile
    let base = specs.baselineLoadKw;
    let pressSpike = 0;
    if (hour >= 8 && hour < 16.5) {
      const isPressActive = i % 3 === 0;
      pressSpike = isPressActive ? specs.pressSpikeKw : specs.pressSpikeKw * 0.35;
      pressSpike *= (1.0 + productionSurgePct / 100);
    } else if (hour >= 16.5 && hour < 24) {
      base *= 0.75;
      pressSpike = (i % 4 === 0) ? specs.pressSpikeKw * 0.3 : 0;
    } else {
      base *= 0.45;
    }
    const factoryLoadKw = Math.round(base + pressSpike);
    const unmanagedNetKw = Math.round(Math.max(0, factoryLoadKw - solarKw));

    // 4. GridPulse AI EMS Battery Dispatch Logic
    let bessPowerKw = 0;

    if (!edgeGuardEnabled) {
      bessPowerKw = 0;
    } else {
      // Night Off-Peak Charging (01:00 to 05:00)
      if (hour >= 1 && hour <= 5 && currentSoc < 0.95 * specs.bessCapacityKwh) {
        const chargeRate = Math.min(specs.bessMaxPowerKw * 0.45, (0.95 * specs.bessCapacityKwh - currentSoc) / dtHours);
        bessPowerKw = -chargeRate;
        currentSoc += Math.abs(bessPowerKw) * dtHours * 0.95;
      }
      // Peak Shaving & Solar Drop Compensation
      else if (unmanagedNetKw > specs.contractCeilingKw && currentSoc > 0.20 * specs.bessCapacityKwh) {
        const deficitKw = unmanagedNetKw - specs.contractCeilingKw;
        const availableDischarge = Math.min(specs.bessMaxPowerKw, (currentSoc - 0.20 * specs.bessCapacityKwh) / dtHours);
        bessPowerKw = Math.min(deficitKw, availableDischarge);
        currentSoc -= (bessPowerKw / 0.95) * dtHours;
      }
      // Solar Surplus Daytime Charging
      else if (solarKw > factoryLoadKw && currentSoc < 0.95 * specs.bessCapacityKwh) {
        const surplusKw = solarKw - factoryLoadKw;
        const chargePower = Math.min(surplusKw, specs.bessMaxPowerKw);
        bessPowerKw = -chargePower;
        currentSoc += chargePower * dtHours * 0.95;
      }
    }

    const managedGridKw = Math.round(Math.max(0, factoryLoadKw - solarKw - bessPowerKw));
    const bessSocPct = Math.min(95, Math.max(20, Math.round((currentSoc / specs.bessCapacityKwh) * 100)));
    const avoidedKw = Math.max(0, unmanagedNetKw - managedGridKw);

    points.push({
      timeStr,
      hour,
      tariff,
      solarKw: Math.round(solarKw),
      factoryLoadKw,
      unmanagedNetKw,
      bessPowerKw: Math.round(bessPowerKw),
      bessSocPct,
      managedGridKw,
      avoidedKw
    });
  }

  const unmanagedPeakKw = Math.max(...points.map(p => p.unmanagedNetKw));
  const managedPeakKw = Math.max(...points.map(p => p.managedGridKw));
  const peakReductionKw = Math.max(0, unmanagedPeakKw - managedPeakKw);
  const peakReductionPct = Math.round((peakReductionKw / unmanagedPeakKw) * 100);

  const unmanagedExcess = Math.max(0, unmanagedPeakKw - specs.contractCeilingKw);
  const managedExcess = Math.max(0, managedPeakKw - specs.contractCeilingKw);
  const unmanagedDemandPenalty = unmanagedExcess * specs.demandPenaltyPerKw;
  const managedDemandPenalty = managedExcess * specs.demandPenaltyPerKw;
  const avoidedDemandPenalty = unmanagedDemandPenalty - managedDemandPenalty;

  const unmanagedEnergyCost = points.reduce((acc, p) => acc + p.unmanagedNetKw * p.tariff * dtHours, 0);
  const managedEnergyCost = points.reduce((acc, p) => acc + p.managedGridKw * p.tariff * dtHours, 0);
  const touArbitrageSavings = Math.max(0, unmanagedEnergyCost - managedEnergyCost);

  const totalUnmanagedBill = unmanagedEnergyCost + unmanagedDemandPenalty;
  const totalManagedBill = managedEnergyCost + managedDemandPenalty;
  const monthlyNetSavings = totalUnmanagedBill - totalManagedBill;
  const annualSavings = monthlyNetSavings * 12;

  const bessCapex = specs.bessCapacityKwh * 180;
  const paybackMonths = Math.round((bessCapex / monthlyNetSavings) * 10) / 10;

  return {
    points,
    unmanagedPeakKw,
    managedPeakKw,
    peakReductionKw,
    peakReductionPct,
    unmanagedDemandPenalty,
    managedDemandPenalty,
    avoidedDemandPenalty,
    unmanagedEnergyCost,
    managedEnergyCost,
    touArbitrageSavings,
    totalUnmanagedBill,
    totalManagedBill,
    monthlyNetSavings,
    annualSavings,
    paybackMonths
  };
}

// 3. PALE SAGE & IVORY SVG POWER FLOW CHART

function MicrogridDispatchChart({
  points,
  contractCeilingKw,
  cloudDropActive,
  selectedHourIdx,
  onHoverIndex,
  height = 360
}) {
  const [showLoad, setShowLoad] = useState(true);
  const [showSolar, setShowSolar] = useState(true);
  const [showBess, setShowBess] = useState(true);
  const [showGrid, setShowGrid] = useState(true);

  const svgRef = useRef<SVGSVGElement>(null);
  const width = 1000;
  const paddingLeft = 60;
  const paddingRight = 30;
  const paddingTop = 30;
  const paddingBottom = 45;

  const chartW = width - paddingLeft - paddingRight;
  const chartH = height - paddingTop - paddingBottom;
  const maxKw = 1350;

  const getX = (idx) => paddingLeft + (idx / (points.length - 1)) * chartW;
  const getY = (kw) => paddingTop + chartH - (Math.max(0, kw) / maxKw) * chartH;

  const loadPath = useMemo(() => {
    return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.factoryLoadKw).toFixed(1)}`).join(' ');
  }, [points, chartW, chartH]);

  const solarPath = useMemo(() => {
    return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.solarKw).toFixed(1)}`).join(' ');
  }, [points, chartW, chartH]);

  const solarAreaPath = useMemo(() => {
    const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.solarKw).toFixed(1)}`).join(' ');
    return `${line} L ${getX(points.length - 1)} ${getY(0)} L ${getX(0)} ${getY(0)} Z`;
  }, [points, chartW, chartH]);

  const gridManagedPath = useMemo(() => {
    return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.managedGridKw).toFixed(1)}`).join(' ');
  }, [points, chartW, chartH]);

  const gridUnmanagedPath = useMemo(() => {
    return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.unmanagedNetKw).toFixed(1)}`).join(' ');
  }, [points, chartW, chartH]);

  const bessPath = useMemo(() => {
    return points.map((p, i) => {
      const displayKw = p.bessPowerKw > 0 ? p.bessPowerKw : 0;
      return `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(displayKw).toFixed(1)}`;
    }).join(' ');
  }, [points, chartW, chartH]);

  const handleMouseMove = (e: React.MouseEvent<SVGSVGElement>) => {
    if (!svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const normX = (mouseX / rect.width) * width;
    const chartX = Math.max(0, Math.min(chartW, normX - paddingLeft));
    const idx = Math.round((chartX / chartW) * (points.length - 1));
    onHoverIndex(Math.max(0, Math.min(points.length - 1, idx)));
  };

  const currentPt = points[selectedHourIdx] || points[0];

  return (
    <div className="w-full flex flex-col gap-3">
      {/* Legend & Series Toggle Bar */}
      <div className="flex flex-wrap items-center justify-between gap-3 text-xs bg-[#F4F6F2] p-3.5 rounded-xl border border-[#DCE4DD]">
        <div className="flex flex-wrap items-center gap-2">
          <button
            onClick={() => setShowLoad(!showLoad)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-all cursor-pointer ${showLoad ? 'bg-[#E5ECE5] text-[#1D3D2F] border border-[#CBD9CD]' : 'text-gray-400 bg-white/50 border border-transparent'}`}
          >
            <span className="w-2.5 h-2.5 rounded-full bg-[#B45309] inline-block" />
            <span>Factory Load ({currentPt.factoryLoadKw} kW)</span>
          </button>

          <button
            onClick={() => setShowSolar(!showSolar)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-all cursor-pointer ${showSolar ? 'bg-[#E5ECE5] text-[#1D3D2F] border border-[#CBD9CD]' : 'text-gray-400 bg-white/50 border border-transparent'}`}
          >
            <span className="w-2.5 h-2.5 rounded-full bg-[#2D7A54] inline-block" />
            <span>Solar PV ({currentPt.solarKw} kW)</span>
          </button>

          <button
            onClick={() => setShowBess(!showBess)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-all cursor-pointer ${showBess ? 'bg-[#E5ECE5] text-[#1D3D2F] border border-[#CBD9CD]' : 'text-gray-400 bg-white/50 border border-transparent'}`}
          >
            <span className="w-2.5 h-2.5 rounded-full bg-[#0891B2] inline-block" />
            <span>BESS Battery ({currentPt.bessPowerKw > 0 ? `+${currentPt.bessPowerKw}` : currentPt.bessPowerKw} kW)</span>
          </button>

          <button
            onClick={() => setShowGrid(!showGrid)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-all cursor-pointer ${showGrid ? 'bg-[#E5ECE5] text-[#1D3D2F] border border-[#CBD9CD]' : 'text-gray-400 bg-white/50 border border-transparent'}`}
          >
            <span className="w-2.5 h-2.5 rounded-full bg-[#2563EB] inline-block" />

            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-[#F8FAF7] p-4 rounded-xl border border-[#DCE5DD]">
                <div className="flex items-center justify-between text-xs text-[#526E60] mb-1">
                  <span>Solar PV Output</span>
                  <CloudSun className="w-4 h-4 text-[#2D7A54]" />
                </div>
                <div className="text-2xl font-mono font-bold text-[#2D7A54]">
                  {sim.points[scrubberIdx]?.solarKw} kW
                </div>
                <span className="text-[11px] text-[#7A8D82]">
                  {isCloudDropSimulated ? '(-53% cloud dip active)' : '(Nominal generation)'}
                </span>
              </div>

              <div className="bg-[#F8FAF7] p-4 rounded-xl border border-[#DCE5DD]">
                <div className="flex items-center justify-between text-xs text-[#526E60] mb-1">
                  <span>BESS Battery Discharge</span>
                  <Battery className="w-4 h-4 text-[#0891B2]" />
                </div>
                <div className="text-2xl font-mono font-bold text-[#0891B2]">
                  {sim.points[scrubberIdx]?.bessPowerKw > 0 ? `+${sim.points[scrubberIdx]?.bessPowerKw}` : sim.points[scrubberIdx]?.bessPowerKw} kW
                </div>
                <span className="text-[11px] text-[#7A8D82]">
                  SoC: {sim.points[scrubberIdx]?.bessSocPct}% (Inverter online)
                </span>
              </div>

              <div className="bg-[#F8FAF7] p-4 rounded-xl border border-[#DCE5DD]">
                <div className="flex items-center justify-between text-xs text-[#526E60] mb-1">
                  <span>Net Grid Draw</span>
                  <Activity className="w-4 h-4 text-[#2563EB]" />
                </div>
                <div className="text-2xl font-mono font-bold text-[#2563EB]">
                  {sim.points[scrubberIdx]?.managedGridKw} kW
                </div>
                <span className="text-[11px] text-[#2D7A54] font-medium">
                  Safely clamped below {activePlant.contractCeilingKw} kW
                </span>
              </div>

              <div className="bg-[#F8FAF7] p-4 rounded-xl border border-[#DCE5DD]">
                <div className="flex items-center justify-between text-xs text-[#526E60] mb-1">
                  <span>Factory Machinery Demand</span>
                  <Zap className="w-4 h-4 text-[#B45309]" />
                </div>
                <div className="text-2xl font-mono font-bold text-[#B45309]">
                  {sim.points[scrubberIdx]?.factoryLoadKw} kW
                </div>
                <span className="text-[11px] text-[#7A8D82]">
                  Industrial production shifts active
                </span>
              </div>
            </div>
          </div>

          {/* ========================================================= */}
          {/* 5. 24-HOUR INTERACTIVE DISPATCH & POWER FLOW GRAPH        */}
          {/* ========================================================= */}
          <div className="bg-white p-6 rounded-2xl border border-[#DCE5DD] shadow-sm space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h3 className="text-lg font-bold text-[#1D3D2F]">
                  24-Hour Autonomous Microgrid Dispatch & Clamping
                </h3>
                <p className="text-xs text-[#526E60] mt-0.5">
                  High-speed predictive minimax schedule clamping net grid imports below contracted threshold limits.
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsEdgeGuardActive(!isEdgeGuardActive)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all cursor-pointer ${isEdgeGuardActive ? 'bg-[#EAF2EB] text-[#2D7A54] border border-[#CBD9CD]' : 'bg-[#FEF2F2] text-[#DC2626] border border-[#FECACA]'}`}
                >
                  {isEdgeGuardActive ? 'AI Edge Guard Active (38ms)' : 'AI Edge Guard Disabled'}
                </button>
              </div>
            </div>

            {/* Error banner if AI guard disabled */}
            {!isEdgeGuardActive && (
              <div className="p-4 rounded-xl bg-[#FEF2F2] border border-[#FECACA] text-[#991B1B] text-xs flex items-center gap-3">
                <AlertTriangle className="w-5 h-5 shrink-0" />
                <div>
                  <span className="font-bold">CRITICAL UTILITY RATCHET BREACH:</span> AI Guard is disabled. Plant grid import has surged to{' '}
                  <span className="font-mono font-bold">{sim.unmanagedPeakKw} kW</span>, triggering a non-negotiable monthly demand penalty of{' '}
                  <span className="font-mono font-bold">${Math.round(sim.unmanagedDemandPenalty).toLocaleString()}</span>.
                </div>
              </div>
            )}

            {/* SVG Graph */}
            <MicrogridDispatchChart
              points={sim.points}
              contractCeilingKw={activePlant.contractCeilingKw}
              cloudDropActive={isCloudDropSimulated}
              selectedHourIdx={scrubberIdx}
              onHoverIndex={setScrubberIdx}
            />

            {/* Timeline Slider */}
            <div className="flex items-center gap-4 bg-[#F8FAF7] p-4 rounded-xl border border-[#DCE5DD]">
              <span className="text-xs text-[#526E60] whitespace-nowrap flex items-center gap-1.5 font-mono">
                <Clock className="w-3.5 h-3.5 text-[#2D7A54]" />
                Timeline: {sim.points[scrubberIdx]?.timeStr}
              </span>
              <input
                type="range"
                min="0"
                max={sim.points.length - 1}
                value={scrubberIdx}
                onChange={(e) => setScrubberIdx(parseInt(e.target.value))}
                className="w-full accent-[#2D7A54] cursor-pointer"
              />
              <span className="text-[11px] font-mono text-[#526E60] whitespace-nowrap">
                {sim.points[scrubberIdx]?.managedGridKw} kW Imported
              </span>
            </div>
          </div>

          {/* ========================================================= */}
          {/* 6. SIDE-BY-SIDE BILLING AUDIT & FINANCIAL ROI LEDGER      */}
          {/* ========================================================= */}
          <div className="bg-white p-6 rounded-2xl border border-[#DCE5DD] shadow-sm space-y-6">
            <div>
              <h3 className="text-lg font-bold text-[#1D3D2F]">
                Side-by-Side Billing & Utility Surcharge Audit
              </h3>
              <p className="text-xs text-[#526E60] mt-0.5">
                Calculated in compliance with standard commercial Time-of-Use tariffs and $35.00/kW 15-minute sliding demand intervals.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              {/* Unmanaged Operations Card */}
              <div className="bg-[#FAFBF9] rounded-2xl p-6 border border-[#E2EAE3]">
                <div className="flex items-center justify-between mb-4">
                  <h4 className="text-sm font-bold text-[#1D3D2F]">Baseline Operations (Without EMS)</h4>
                  <span className="px-2 py-0.5 rounded bg-[#FEE2E2] text-[#991B1B] text-[10px] font-bold">
                    Unmitigated
                  </span>
                </div>

                <div className="space-y-3 font-mono text-xs">
                  <div className="flex justify-between py-2 border-b border-[#EAEFEA]">
                    <span className="text-[#526E60]">Peak Demand Draw:</span>
                    <span className="text-[#1D3D2F] font-bold">{sim.unmanagedPeakKw} kW</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-[#EAEFEA]">
                    <span className="text-[#526E60]">Contract Limit Breach:</span>
                    <span className="text-[#DC2626] font-bold">+{sim.unmanagedPeakKw - activePlant.contractCeilingKw} kW</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-[#EAEFEA]">
                    <span className="text-[#526E60]">Demand Surcharges:</span>
                    <span className="text-[#DC2626] font-bold">${Math.round(sim.unmanagedDemandPenalty).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-[#EAEFEA]">
                    <span className="text-[#526E60]">Energy Usage Cost:</span>
                    <span className="text-[#1D3D2F]">${Math.round(sim.unmanagedEnergyCost).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between pt-3 text-sm font-sans font-bold text-[#1D3D2F]">
                    <span>Total Monthly Bill:</span>
                    <span className="text-[#DC2626] font-mono">${Math.round(sim.totalUnmanagedBill).toLocaleString()}</span>
                  </div>
                </div>
              </div>

              {/* GridPulse Operations Card */}
              <div className="bg-[#F4F8F4] rounded-2xl p-6 border border-[#CDE0D0]">
                <div className="flex items-center justify-between mb-4">
                  <h4 className="text-sm font-bold text-[#1D3D2F]">GridPulse AI Microgrid Operations</h4>
                  <span className="px-2 py-0.5 rounded bg-[#EAF2EB] text-[#2D7A54] text-[10px] font-bold">
                    AI Protected
                  </span>
                </div>

                <div className="space-y-3 font-mono text-xs">
                  <div className="flex justify-between py-2 border-b border-[#E2EAE3]">
                    <span className="text-[#526E60]">Peak Demand Draw:</span>
                    <span className="text-[#2D7A54] font-bold">{sim.managedPeakKw} kW (▼ {sim.peakReductionPct}%)</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-[#E2EAE3]">
                    <span className="text-[#526E60]">Contract Limit Status:</span>
                    <span className="text-[#2D7A54] font-bold">Safely Clamped</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-[#E2EAE3]">
                    <span className="text-[#526E60]">Avoided Surcharges:</span>
                    <span className="text-[#2D7A54] font-bold">-${Math.round(sim.avoidedDemandPenalty).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-[#E2EAE3]">
                    <span className="text-[#526E60]">ToU Night Shift Arbitrage:</span>
                    <span className="text-[#2D7A54] font-bold">-${Math.round(sim.touArbitrageSavings).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between pt-3 text-sm font-sans font-bold text-[#1D3D2F]">
                    <span>Net Monthly Bill:</span>
                    <span className="text-[#2D7A54] font-mono">${Math.round(sim.totalManagedBill).toLocaleString()}</span>
                  </div>
                </div>
              </div>

            </div>

            {/* 5-Year Cumulative ROI */}
            <div className="bg-[#FAFBF9] p-6 rounded-2xl border border-[#DCE5DD]">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                <span className="text-xs font-bold uppercase tracking-wider text-[#1D3D2F]">
                  5-Year Cumulative Cashflow Savings
                </span>
                <span className="text-xs font-mono text-[#2D7A54] font-bold">
                  Annual Savings: +${Math.round(sim.annualSavings).toLocaleString()} / yr
                </span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 font-mono text-xs text-center">
                {[1, 2, 3, 4, 5].map((year) => {
                  const saved = Math.round(sim.annualSavings * year);
                  return (
                    <div key={year} className="bg-white p-3 rounded-xl border border-[#DCE5DD]">
                      <span className="text-[#7A8D82] text-[10px] block mb-1">Year {year}</span>
                      <span className="text-[#1D3D2F] font-bold text-sm block">${saved.toLocaleString()}</span>
                      <span className="text-[10px] text-[#2D7A54] block mt-0.5">Cumulative</span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* ========================================================= */}
          {/* 7. PARAMETER SENSITIVITY STRESS TESTING SANDBOX           */}
          {/* ========================================================= */}
          <div className="bg-white p-6 rounded-2xl border border-[#DCE5DD] shadow-sm space-y-6">
            <div>
              <h3 className="text-lg font-bold text-[#1D3D2F]">
                Live Engineering Parameter Sensitivity Sandbox
              </h3>
              <p className="text-xs text-[#526E60] mt-0.5">
                Stress-test edge controller dispatch thresholds by adjusting cloud loss severity and hydraulic machinery surges.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="bg-[#F8FAF7] p-5 rounded-2xl border border-[#DCE5DD] space-y-3">
                <div className="flex justify-between text-xs font-mono">
                  <span className="text-[#526E60] font-semibold">Cloud Cover Dip Loss</span>
                  <span className="text-[#B45309] font-bold">-{cloudSeverityPct}% Irradiance</span>
                </div>
                <input
                  type="range"
                  min="10"
                  max="80"
                  value={cloudSeverityPct}
                  onChange={(e) => setCloudSeverityPct(parseInt(e.target.value))}
                  className="w-full accent-[#2D7A54] cursor-pointer"
                />
                <span className="text-[11px] text-[#7A8D82] block">
                  Simulates sudden occlusion across rooftop solar arrays.
                </span>
              </div>

              <div className="bg-[#F8FAF7] p-5 rounded-2xl border border-[#DCE5DD] space-y-3">
                <div className="flex justify-between text-xs font-mono">
                  <span className="text-[#526E60] font-semibold">Manufacturing Press Surge</span>
                  <span className="text-[#1D3D2F] font-bold">+{productionSurgePct}% Extra Load</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="50"
                  value={productionSurgePct}
                  onChange={(e) => setProductionSurgePct(parseInt(e.target.value))}
                  className="w-full accent-[#2D7A54] cursor-pointer"
                />
                <span className="text-[11px] text-[#7A8D82] block">
                  Simulates simultaneous stamping press activation during peak shifts.
                </span>
              </div>
            </div>
          </div>

          {/* ========================================================= */}
          {/* 8. MODBUS TCP EDGE TERMINAL & PROTOCOL LOGS               */}
          {/* ========================================================= */}
          <div className="bg-white p-6 rounded-2xl border border-[#DCE5DD] shadow-sm space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-lg font-bold text-[#1D3D2F]">
                  Edge Controller & Modbus Protocol Stream
                </h3>
                <span className="text-xs text-[#526E60]">
                  Deterministic sub-50ms polling loop communicating with industrial four-quadrant inverters.
                </span>
              </div>
              <div className="flex items-center gap-2 text-xs font-mono text-[#2D7A54]">
                <span className="w-2 h-2 rounded-full bg-[#2D7A54] animate-pulse" />
                <span>Modbus TCP (Port 502)</span>
              </div>
            </div>

            <div className="bg-[#18241D] p-5 rounded-2xl font-mono text-xs text-[#D5E2D8] space-y-2 h-[260px] overflow-y-auto shadow-inner">
              <div className="text-[#A3E635]">[00:00:38.102] MODBUS-TCP: Inverter register 0x04A2 read: 380 kW discharge commanded</div>
              <div className="text-[#9CA3AF]">[00:00:38.108] HiGHS-LP Solver: Minimax linear formulation converged in 14 iterations (0.84ms)</div>
              <div className="text-[#60A5FA]">[00:00:38.120] EDGE GUARD: Factory load surge detected (1,140 kW). Solar dip active (218 kW).</div>
              <div className="text-[#A3E635]">[00:00:38.138] INVERTER DISPATCH: BESS ramped to +472 kW in 34ms. Grid draw clamped to 448.2 kW.</div>
              <div className="text-[#D1D5DB]">[00:00:38.150] IEEE 2030.7 COMPLIANCE: Voltage 480V ±0.8%, Frequency 59.98 Hz, Power Factor 0.98.</div>
              <div className="text-[#A3E635]">[00:00:38.200] TELEMETRY PUSH: Interval telemetry buffered to local flash storage (96 data points).</div>
              <div className="text-[#FBBF24]">[00:00:38.250] TARIFF WATCH: Approaching On-Peak window ($0.34/kWh). Battery SoC locked at 78.4%.</div>
              <div className="text-[#9CA3AF]">[00:00:38.300] WATCHDOG: Sub-cycle edge heartbeat healthy. Modbus packet loss: 0.00%.</div>
            </div>
          </div>

          {/* ========================================================= */}
          {/* 9. EXECUTIVE AUDIT & CSV EXPORTER                         */}
          {/* ========================================================= */}
          <div className="bg-[#1D3D2F] text-white p-8 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-6 shadow-md">
            <div className="space-y-1">
              <div className="flex items-center gap-2 text-[#A3E635] text-xs font-mono uppercase tracking-wider">
                <Shield className="w-4 h-4 text-[#A3E635]" />
                <span>Certified Energy Compliance Exporter</span>
              </div>
              <h3 className="text-xl sm:text-2xl font-bold tracking-tight">
                Export Executive Compliance Telemetry
              </h3>
              <p className="text-xs sm:text-sm text-[#D5E2D8] max-w-xl">
                Generate signed 15-minute sliding window datasets formatted for utility auditors, board presentations, and IEEE 2030.7 reviews.
              </p>
            </div>

            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
              <button
                onClick={handleDownloadCsv}
                className="w-full sm:w-auto px-6 py-3.5 bg-white text-[#1D3D2F] font-bold text-xs sm:text-sm rounded-xl hover:bg-[#F0F5F1] transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm"
              >
                <Download className="w-4 h-4 text-[#1D3D2F]" />
                <span>Download 15-Min CSV</span>
              </button>

              <button
                onClick={() => window.print()}
                className="w-full sm:w-auto px-6 py-3.5 bg-[#2A5441] text-white font-semibold text-xs sm:text-sm rounded-xl hover:bg-[#34664F] transition-all flex items-center justify-center gap-2 cursor-pointer border border-[#3A6E55]"
              >
                <FileText className="w-4 h-4" />
                <span>Print Audit Sheet</span>
              </button>
            </div>
          </div>

        </main>

        {/* Global Dashboard Footer */}
        <footer className="mt-auto py-6 border-t border-[#E5ECE6] px-8 text-center text-xs text-[#7A8D82] bg-white">
          GridPulse Industrial Energy Management Systems &copy; 2026. IEEE 2030.7 Microgrid Standard Compliant.
        </footer>

      </div>

    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
